# ══════════════════════════════════════════════════════════════════════════════
# HydroEO — River Profile Configuration (Use Case E)
# ══════════════════════════════════════════════════════════════════════════════
# Compute a longitudinal water-surface-elevation (WSE) profile along a river
# from SWOT L2 HR Raster tiles, sampled at user-supplied chainage points.
# HydroEO downloads the matching SWOT tiles itself. Requires NASA Earthdata
# credentials.
#
# Quick-start:
#   1. Set project.main_dir and project.startdate / project.enddate.
#   2. Set river_profile.chainage_path to a point shapefile with an
#      along-river distance column (see chainage_field below).
#   3. Add Earthdata credentials (or set EARTHDATA_USERNAME / EARTHDATA_PASSWORD).
#   4. Run project.initialize() then project.download().
#
# See configs/river_profile.md for a full configuration reference.
# ══════════════════════════════════════════════════════════════════════════════

# ─── PROJECT ──────────────────────────────────────────────────────────────────
project:
  main_dir: "/path/to/your/project"

gis:
  global_crs: 'EPSG:4326'


# ─── CREDENTIALS ──────────────────────────────────────────────────────────────
earthaccess:
  username: null   # or set EARTHDATA_USERNAME
  password: null   # or set EARTHDATA_PASSWORD


# ─── RIVER PROFILE ─────────────────────────────────────────────────────────────
river_profile:
  enabled: true

  name: "my_river"                    # identifier used as output filename/directory prefix
  chainage_path: "/path/to/chainage.shp"   # or .gpkg
  chainage_field: "cngmeters"         # column with along-river distance, in metres
  reverse_chainage: false             # true -> flips distance so 0 becomes the upstream end

  startdate: [2024, 1, 1]
  enddate:   [2024, 12, 31]

  aoi_buffer_meters: 2000             # buffer around chainage extent used for the SWOT search/clip

  keep_intermediates: false           # false = only final profile shapefiles + final CSV
  plot_enable: true                   # per-date + combined diagnostic plots


# ─── ADVANCED OPTIONS ─────────────────────────────────────────────────────────
# All fields below have sensible defaults and can be omitted.
# Uncomment and merge the keys you want into the river_profile section above.
# ──────────────────────────────────────────────────────────────────────────────

